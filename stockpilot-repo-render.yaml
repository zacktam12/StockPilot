# render.yaml for StockPilot Repository (Frontend + Backend Only)
# Place this file in your StockPilot repository root

services:
  # Backend API Service
  - type: web
    name: stockpilot-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_EMAIL_PASS
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://stockpilot-frontend.onrender.com,https://stockpilot-landing.onrender.com
      - key: REDIS_ENABLED
        value: false
    healthCheckPath: /api/health

  # Frontend App (Static Site)
  - type: web
    name: stockpilot-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://stockpilot-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

